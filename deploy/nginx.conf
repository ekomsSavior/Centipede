# Centipede C2 - nginx TLS + WebSocket reverse proxy sample
#
# Terminates TLS on 443 and proxies both the operator HTTP API/dashboard and
# the bot WebSocket channel to the local c2d listener. c2d then runs plain
# HTTP bound to 127.0.0.1:
#
#   ./bin/c2d -addr 127.0.0.1:8443 -token "op-secret"
#
# Place under /etc/nginx/sites-available/ and enable with a symlink, or adapt
# to Caddy (`reverse_proxy 127.0.0.1:8443` does the same thing).

server {
    listen 443 ssl;
    server_name c2.example.com;

    ssl_certificate     /etc/letsencrypt/live/c2.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/c2.example.com/privkey.pem;

    # operator dashboard + REST API
    location / {
        proxy_pass http://127.0.0.1:8443;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # bot + operator websocket channels
    location /ws {
        proxy_pass http://127.0.0.1:8443;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# optional HTTP -> HTTPS redirect
server {
    listen 80;
    server_name c2.example.com;
    return 301 https://$host$request_uri;
}
